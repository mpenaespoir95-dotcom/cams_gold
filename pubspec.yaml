name: cams_gold
description: "Application Flutter de gestion d'un comptoir d'or et de devises."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  pdf: ^3.13.1
  printing: ^5.15.1
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: 3.5.2 # Keep aligned with the SQLite WASM binary in web/.
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/cams_gold.jpeg
